<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Sample</title>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script src="./tableau.extensions.1.latest.min.js"></script>
    <script src="./vizImage.js"></script>
<style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            margin: 0;
            padding: 0;
        }
        .container {
            display: flex;
            justify-content:center;
            flex-wrap: wrap;
            gap: 20px;
            padding-top: 20px;
        }
        .container::before{
          display:none
        }
        .card_new {
            background-color: white;
          border-width: 1px;
          border-style: solid;
          border-color: rgb(0, 191, 225);
            width: 300px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s;
        }
        .card_new:hover {
            transform: scale(1.05);
        }
        .card_new .content img {
            width: 100%;
            height: auto;
            max-height: 200px;
            max-width: 250px;
            object-fit: contain;
            padding: 10px;
        }
        .card_new .content {
          background-color: rgb(255, 255, 255);
          font-family: Arial;
          font-size: 9pt;
          display: flex;
          flex-direction:column;
          align-items:center;
            padding-bottom: 10px;
        }
        .card_new .content p {
            font-size: 12px;
            color: #555;
            margin: 8px 0;
          display:flex;
          flex-direction:column;
          align-items:center;
        }
        .tooltip {
              position: absolute;
              max-width:400px;
              display: none;
              background-color: white;
              color: black;
              border: 1px solid #ccc;
              box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
              border-radius: 4px;
              padding: 8px;
              font-size: 14px;
              z-index: 1000;
            }
    </style>
  </head>
  <body>
  <div id="app" class="container"></div>
  <div id="tooltip" class="tooltip"></div>
    <div id="pagination" style="height:20px; bottom: 0px; z-index: 100; background: white;"></div>
  </body>
</html>
